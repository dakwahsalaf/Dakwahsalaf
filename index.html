<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#000000">

<meta property="og:type" content="website">

<style>
:root{--bg:#000;--fg:#fff;--mut:rgba(255,255,255,.7);--acc:#2fbf71;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#feed{height:calc(100% - 56px - env(safe-area-inset-bottom,0px));overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
.poster{position:absolute;inset:0;background:#000 center/cover no-repeat;transition:opacity .25s}
.reel.playing .poster{opacity:0}
.yt{position:absolute;inset:0}
.yt iframe{width:100%;height:100%;border:0;pointer-events:none;background:#000}
.tap{position:absolute;inset:0;z-index:1}
.reel.fb .tap,.reel.fb .seek,.reel.fb .pp{display:none}
.reel.fb .yt iframe{pointer-events:auto}
.side{position:absolute;right:10px;bottom:84px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:4}
.btn{width:46px;height:46px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px)}
.btn.on{color:#ff5a6e}
.seek{position:absolute;left:0;right:0;bottom:0;padding:0 14px 12px;touch-action:none;cursor:pointer;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:3}
.time{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;color:#fff;padding-bottom:10px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.track{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.3);transition:height .15s}
.track i{display:block;height:100%;width:0;border-radius:2px;background:var(--acc)}
.track b{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.5)}
.seek.drag .track{height:8px}
.seek.drag .time{font-size:18px;font-weight:600}
#share{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
#share.open{display:flex}
.sp{width:100%;background:#1b1b1b;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sp h3{font-size:16px;margin-bottom:4px}
.sp small{display:block;color:var(--mut);font-size:12px;margin-bottom:16px;word-break:break-all}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
.opt{background:none;border:0;color:#fff;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.opt i{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:16px;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#start{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.65);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:32px;cursor:pointer}
#start.show{display:flex}
#start .go{width:84px;height:84px;border-radius:50%;background:var(--acc);color:#04210f;display:flex;align-items:center;justify-content:center;font-size:38px}
#start p{font-size:15px;color:#fff}
.tip{position:absolute;top:50%;margin-top:-30px;padding:10px 16px;border-radius:24px;background:rgba(0,0,0,.55);font-size:16px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
.tip.show{opacity:1}
.tip.l{left:12%}.tip.r{right:12%}
.pp{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:34px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
.reel.paused .pp{opacity:1}
.top{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:18px;font-weight:700}
#install{display:none;pointer-events:auto;border:0;border-radius:14px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--acc);color:#04210f;cursor:pointer}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:12px;color:var(--mut);line-height:1.5}
.empty h2{color:var(--fg);font-size:20px}
.msg{position:absolute;inset:0;margin:auto;height:fit-content;width:fit-content;max-width:80%;text-align:center;background:rgba(0,0,0,.7);padding:12px 16px;border-radius:12px;font-size:14px;display:none;z-index:2}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#000;border-top:1px solid rgba(255,255,255,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;height:56px;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
#tabs button.on{color:#fff}
#tabs svg{width:24px;height:24px;fill:currentColor}
body.h .top{background:#000}
#home{position:fixed;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));overflow-y:auto;padding:calc(52px + env(safe-area-inset-top,0px)) 0 16px;overscroll-behavior:contain;background:#000;display:none}
#home .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px 12px}
@media(min-width:600px){#home .grid{padding:0 12px}}
.vc{display:block;width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.vc .th{position:relative;aspect-ratio:16/9;background:#222 center/cover no-repeat}
.vc .du{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);padding:2px 5px;border-radius:4px;font-size:12px;font-weight:600}
.vc .in{padding:10px 12px 0}
.vc .ti{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc .me{font-size:12.5px;color:var(--mut);margin-top:4px}
#watch{position:fixed;inset:0;z-index:12;background:#000;display:none;flex-direction:column}
#watch.open{display:flex}
#watch .bar{padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px}
#watch .wx{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer}
#watch .pl{width:min(100%,calc((100dvh - 130px) * 1.7778));aspect-ratio:16/9;margin:0 auto;background:#000}
#watch .pl iframe{width:100%;height:100%;border:0}
#watch .info{padding:14px;overflow:auto;max-width:900px;margin:0 auto;width:100%}
#watch .wt{font-size:17px;line-height:1.35}
#watch .wc{color:var(--mut);font-size:13px;margin:6px 0 14px}
#watch .wy{border:0;border-radius:18px;padding:9px 16px;font-weight:700;background:var(--acc);color:#04210f;cursor:pointer}
</style>
</head>
<body>
<div class="top"><h1>Dakwah Salaf</h1><button id="install">Pasang</button></div>
<div id="share"><div class="sp">
  <h3>Bagikan video</h3><small id="sl"></small>
  <div class="opts">
    <button class="opt" data-a="wa"><i style="background:#25d366">WA</i>WhatsApp</button>
    <button class="opt" data-a="tg"><i style="background:#2aabee">TG</i>Telegram</button>
    <button class="opt" data-a="fb"><i style="background:#1877f2">f</i>Facebook</button>
    <button class="opt" data-a="x"><i style="background:#333">X</i>X</button>
    <button class="opt" data-a="copy"><i style="background:#555">🔗</i>Salin tautan</button>
    <button class="opt" data-a="more" id="more"><i style="background:#8a5cf6">⋯</i>Lainnya</button>
  </div>
</div></div>
<div id="toast"></div>
<div id="start"><div class="go">▶</div><p>Ketuk untuk memutar video dengan suara</p></div>
<div id="feed"><div class="empty"><h2>Memuat video…</h2></div></div>
<div id="home"><div class="empty"><h2>Memuat video…</h2></div></div>
<div id="watch"><div class="bar"><button class="wx" aria-label="Tutup">←</button></div><div class="pl"></div><div class="info"><h2 class="wt"></h2><p class="wc"></p><button class="wy">Buka di YouTube</button></div></div>
<nav id="tabs">
  <button data-t="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>Beranda</button>
  <button data-t="short"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M8 3h8a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm2 6v6l5-3z"/></svg>Short</button>
</nav>

<script>
/* ===== PENGATURAN ===== */
// Daftar channel YouTube (video short dari semua channel digabung dan diacak). Boleh berupa:
//   "https://www.youtube.com/@namachannel"
//   "https://www.youtube.com/channel/UCxxxxxxxxxxxxxxxxxxxxxx"
//   atau cukup "@namachannel"
var YT_CHANNELS = [
  "https://www.youtube.com/@firandaandirjaofficial",
  "https://www.youtube.com/@rodjatv",
  "https://www.youtube.com/@syafiqrizabasalamahofficial",
  "https://www.youtube.com/@dr.muamarmaruf_lc_ma"
];

// Kunci YouTube Data API v3 (gratis, dari console.cloud.google.com).
// Batasi kunci ini hanya untuk domain situs Anda (HTTP referrer) dan hanya YouTube Data API v3.
var YT_API_KEY = "AIzaSyC0c-m00EzB3UTVzifTbnLOHdX_dfcfkCE";

// Video tambahan satu per satu (ID video, tanpa perlu API key). Ditambahkan ke video dari channel di atas.
// Contoh: "https://youtube.com/shorts/yk5HrF7n9Xs" -> ID-nya "yk5HrF7n9Xs"
var EXTRA_IDS = ["yk5HrF7n9Xs"];

var MAX_VIDEOS = 200;  // batas jumlah short yang diambil
/* ======================= */

(function(){
  var CACHE="dakwah_yt_cache_v2", TTL=30*60*1000, LIKE="dakwah_likes_v2";
  var feed=document.getElementById("feed"), muted=false, unlocked=false, likes={}, pool=[], total=0, lastId="", want=null, cur=null, live=[], AHEAD=2, BEHIND=1;
  var startEl=document.getElementById("start");

  try{want=new URLSearchParams(location.search).get("v")}catch(e){}
  var tab=want?"short":"home";
  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
  likes=load(LIKE,{});
  function showMsg(h,t){feed.innerHTML="";var e=el("div","empty");e.appendChild(el("h2",null,h));if(t)e.appendChild(el("p",null,t));feed.appendChild(e)}

  /* ---------- Ambil daftar short dari YouTube ---------- */
  function api(path,params){
    var q=Object.keys(params).map(function(k){return k+"="+encodeURIComponent(params[k])}).join("&");
    return fetch("https://www.googleapis.com/youtube/v3/"+path+"?"+q+"&key="+encodeURIComponent(YT_API_KEY)).then(function(r){
      if(!r.ok)throw new Error("YouTube "+r.status);
      return r.json();
    });
  }
  function channelId(ch){
    var s=(ch||"").trim(),m;
    if((m=s.match(/(UC[\w-]{22})/)))return Promise.resolve(m[1]);
    if((m=s.match(/@([\w.\-]+)/))){
      return api("channels",{part:"id",forHandle:"@"+m[1]}).then(function(d){
        if(!d.items||!d.items.length)throw new Error("Channel tidak ditemukan");
        return d.items[0].id;
      });
    }
    return Promise.reject(new Error("Link channel tidak dikenali"));
  }
  function playlistIds(pl){
    var ids=[];
    function page(tok){
      var p={part:"contentDetails",maxResults:50,playlistId:pl};
      if(tok)p.pageToken=tok;
      return api("playlistItems",p).then(function(d){
        (d.items||[]).forEach(function(it){ids.push(it.contentDetails.videoId)});
        if(d.nextPageToken&&ids.length<MAX_VIDEOS)return page(d.nextPageToken);
        return ids;
      });
    }
    return page();
  }
  function secs(iso){var m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso||"");return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):9999}
  function onlyShort(ids){ // cadangan: saring video <= 3 menit
    var out=[],jobs=[];
    for(var i=0;i<ids.length;i+=50)(function(chunk){
      jobs.push(api("videos",{part:"contentDetails",id:chunk.join(",")}).then(function(d){
        (d.items||[]).forEach(function(v){if(secs(v.contentDetails.duration)<=180)out.push(v.id)});
      }));
    })(ids.slice(i,i+50));
    return Promise.all(jobs).then(function(){return out});
  }
  function fetchChannel(ch){
    var key=ch,ck=CACHE+":"+ch,c=load(ck,null);
    if(c&&c.key===key&&Date.now()-c.t<TTL)return Promise.resolve(c.items);
    return channelId(ch).then(function(id){
      // UUSH + sisa ID channel = daftar khusus YouTube Shorts
      return playlistIds("UUSH"+id.slice(2)).catch(function(){return []}).then(function(ids){
        if(ids.length)return ids;
        return playlistIds("UU"+id.slice(2)).then(onlyShort);
      });
    }).then(function(items){
      save(ck,{key:key,t:Date.now(),items:items});
      return items;
    }).catch(function(e){
      console.error(ch,e);
      if(c&&c.key===key&&c.items.length)return c.items;
      return [];
    });
  }
  function fetchList(){
    var jobs=(YT_API_KEY?YT_CHANNELS:[]).map(fetchChannel);
    return Promise.all(jobs).then(function(lists){
      var all=EXTRA_IDS.slice();
      lists.forEach(function(l){all=all.concat(l)});
      if(!all.length)throw new Error("Tidak ada video");
      return all;
    });
  }

  // Acak Fisher-Yates; video pertama batch baru tidak sama dengan video terakhir sebelumnya
  function shuffled(){
    var a=pool.slice(),i,j,t;
    for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}
    if(want){
      i=a.indexOf(want);
      if(i>-1)a.splice(i,1);
      if(/^[\w-]{11}$/.test(want))a.unshift(want);
      want=null;
    }
    if(a.length>1&&a[0]===lastId){t=a[0];a[0]=a[a.length-1];a[a.length-1]=t}
    lastId=a[a.length-1];
    return a;
  }

  /* ---------- Pemutar: iframe YouTube + postMessage (tanpa skrip iframe_api) ---------- */
  var ORIGIN="https://www.youtube-nocookie.com";

  function setSound(){
    document.querySelectorAll(".snd").forEach(function(b){b.textContent=muted?"🔇":"🔊"});
  }
  function cmd(r,func,args){
    if(!r._f||!r._f.contentWindow)return;
    try{r._f.contentWindow.postMessage(JSON.stringify({event:"command",func:func,args:args||[]}),ORIGIN)}catch(e){}
  }
  function applySound(r){if(muted)cmd(r,"mute");else{cmd(r,"unMute");cmd(r,"setVolume",[100])}}

  function build(r,auto){
    if(r._f)return;
    var id=r.dataset.id,host=r.querySelector(".yt"),f=document.createElement("iframe");
    var q="enablejsapi=1&controls=0&playsinline=1&rel=0&modestbranding=1&fs=0&disablekb=1&iv_load_policy=3&loop=1&playlist="+id+"&autoplay="+(auto?1:0);
    if(/^https?:$/.test(location.protocol))q+="&origin="+encodeURIComponent(location.origin);
    f.src=ORIGIN+"/embed/"+id+"?"+q;
    f.allow="autoplay; encrypted-media";
    r._ready=false;r._played=false;r._st=-1;r._t=0;r._tt=0;r._d=0;r._hs=0;
    f.addEventListener("load",function(){listen(r,f)});
    host.innerHTML="";host.appendChild(f);
    r._f=f;live.push(r);
  }
  // jabat tangan dengan pemutar YouTube: kirim "listening" sampai pemutar membalas
  function listen(r,f){
    clearInterval(r._li);var n=0;
    r._li=setInterval(function(){
      if(r._f!==f||r._hs||n++>60){clearInterval(r._li);return}
      try{f.contentWindow.postMessage(JSON.stringify({event:"listening",id:+r.dataset.i,channel:"widget"}),ORIGIN)}catch(e){}
    },250);
  }
  function setState(r,st){
    r._st=st;
    var isNow=!!(cur&&cur.r===r);
    if(st===1){
      if(!isNow||tab!=="short"){cmd(r,"pauseVideo");return}
      r._played=true;
      r.classList.add("playing");r.classList.remove("paused");startEl.classList.remove("show");r.querySelector(".msg").style.display="none";
    }else if(st===2){
      if(isNow)r.classList.add("paused");
    }else if(st===0){
      if(isNow){cmd(r,"seekTo",[0,true]);cmd(r,"playVideo")}
    }
  }
  window.addEventListener("message",function(e){
    if(e.origin!==ORIGIN)return;
    var r=null,i;
    for(i=0;i<live.length;i++){if(live[i]._f&&live[i]._f.contentWindow===e.source){r=live[i];break}}
    if(!r)return;
    var d=e.data;
    if(typeof d==="string"){try{d=JSON.parse(d)}catch(x){return}}
    if(!d||!d.event)return;
    r._hs=1;
    var info=d.info;
    if((d.event==="onReady"||d.event==="initialDelivery")&&!r._ready){
      r._ready=true;clearInterval(r._li);applySound(r);
      if(cur&&cur.r===r&&!r._userPaused&&!r._fb&&tab==="short"){cmd(r,"playVideo");verify(r)}
    }
    if(d.event==="onError"){
      if(cur&&cur.r===r){
        var m=r.querySelector(".msg");m.textContent="Video tidak dapat diputar.";m.style.display="block";
        setTimeout(function(){if(cur&&cur.r===r&&r.nextElementSibling)r.nextElementSibling.scrollIntoView({behavior:"smooth"})},1500);
      }
      return;
    }
    if(info&&typeof info==="object"){
      if(typeof info.duration==="number"&&info.duration>0)r._d=info.duration;
      if(typeof info.currentTime==="number"){r._t=info.currentTime;r._tt=Date.now()}
      if(typeof info.playerState==="number")setState(r,info.playerState);
    }else if(d.event==="onStateChange"&&typeof info==="number")setState(r,info);
  });

  // pastikan video benar-benar jalan; jika autoplay bersuara diblokir, minta ketukan sekali
  function verify(r){
    var n=0;
    (function check(){
      setTimeout(function(){
        if(!cur||cur.r!==r||r._userPaused||!r._f||tab!=="short")return;
        var st=r._st;
        if(st===1)return;
        if(st===3&&n++<6){check();return}
        if(st!==3&&n++<3){cmd(r,"playVideo");check();return}
        if(!unlocked){startEl.classList.add("show")}
        else{muted=true;setSound();applySound(r);cmd(r,"playVideo")}
      },700);
    })();
  }
  function guard(r){
    clearTimeout(r._wd);
    r._wd=setTimeout(function(){
      if(!cur||cur.r!==r||r._userPaused||r._st===1||r._fb||tab!=="short")return;
      if(!r._hs){fallback(r);return} // pemutar tidak membalas sama sekali → iframe polos (autoplay)
      if(!unlocked)startEl.classList.add("show");
    },6000);
  }
  function fallback(r){
    destroy(r);
    build(r,true);
    r._fb=true;r.classList.add("fb","playing");
  }
  function destroy(r){
    clearTimeout(r._wd);clearTimeout(r._pt);clearInterval(r._li);
    r._fb=false;r.classList.remove("fb","playing","paused");
    var h=r.querySelector(".yt");if(h)h.innerHTML="";
    r._f=null;live=live.filter(function(x){return x!==r});
    r._ready=false;r._played=false;r._st=-1;r._hs=0;r._userPaused=false;
    var m=r.querySelector(".msg");if(m)m.style.display="none";
  }
  function pauseReel(r){ // tidak dihancurkan: tetap siap supaya kalau kembali langsung tampil
    clearTimeout(r._wd);
    r._userPaused=false;r.classList.remove("paused");
    if(r._fb){destroy(r);return}
    cmd(r,"pauseVideo");
  }
  function playReel(r){
    r._userPaused=false;r.classList.remove("paused");
    if(!r._f){build(r,true)}
    else if(r._ready&&!r._fb){
      if(r._played)cmd(r,"seekTo",[0,true]);
      applySound(r);cmd(r,"playVideo");
      verify(r);
    }
    guard(r);
  }
  // siapkan video berikutnya (dan sebelumnya) di latar belakang
  function preload(r){
    var i=+r.dataset.i,want=[],k,n;
    for(k=1;k<=AHEAD;k++){n=feed.children[i+k];if(n&&n.classList.contains("reel"))want.push(n)}
    n=feed.children[i-BEHIND];if(n&&n.classList.contains("reel"))want.push(n);
    live.slice().forEach(function(x){if(x!==r&&want.indexOf(x)<0)destroy(x)});
    want.forEach(function(x,k){
      if(x._f)return;
      clearTimeout(x._pt);
      x._pt=setTimeout(function(){
        if(x._f||!cur)return;
        var d=+x.dataset.i-(+cur.r.dataset.i);
        if(d>=-BEHIND&&d<=AHEAD)build(x,false);
      },(k+1)*400);
    });
  }
  function activate(r){
    if(cur&&cur.r===r)return;
    var old=cur&&cur.r;
    cur={r:r};
    if(old)pauseReel(old);
    playReel(r);
    if(+r.dataset.i>=total-3)addBatch(); // hampir habis → tambah acakan baru (tanpa akhir)
    preload(r);
  }

  startEl.addEventListener("click",function(){
    unlocked=true;muted=false;setSound();startEl.classList.remove("show");
    if(cur){
      var rr=cur.r;
      if(rr._f&&rr._ready&&!rr._fb){applySound(rr);cmd(rr,"playVideo")}
      else{destroy(rr);build(rr,true);guard(rr)}
    }
  });

  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting&&e.intersectionRatio>=.6)activate(e.target);
    });
  },{root:feed,threshold:[.6]});

  // Perbarui bilah progres video aktif
  function fmt(t){if(!isFinite(t)||t<0)t=0;var m=Math.floor(t/60),x=Math.floor(t%60);return m+":"+(x<10?"0":"")+x}
  setInterval(function(){
    if(!cur||!cur.r._f||!cur.r._paint||cur.r._drag)return;
    cur.r._paint();
  },250);

  function addReel(id){
    var r=el("section","reel");
    r.dataset.i=total++;r.dataset.id=id;
    var poster=el("div","poster");poster.style.backgroundImage="url(https://i.ytimg.com/vi/"+id+"/hqdefault.jpg)";
    var host=el("div","yt"),tap=el("div","tap");
    var msg=el("div","msg","Video tidak dapat diputar.");

    var seek=el("div","seek"),time=el("div","time"),tcur=el("span",null,"0:00"),tdur=el("span",null,"0:00");
    var track=el("div","track"),fill=document.createElement("i"),knob=document.createElement("b");
    time.appendChild(tcur);time.appendChild(tdur);track.appendChild(fill);track.appendChild(knob);seek.appendChild(time);seek.appendChild(track);
    function P(){return(r._f&&r._ready&&!r._fb)?r:null}
    r._paint=function(){
      if(!r._f||r._fb)return;
      var d=r._d||0,c=r._t||0;
      if(r._st===1&&r._tt)c+=(Date.now()-r._tt)/1000;
      if(d&&c>d)c=d;
      var pct=d?c/d*100:0;
      fill.style.width=pct+"%";knob.style.left=pct+"%";tcur.textContent=fmt(c);tdur.textContent=fmt(d);
    };
    function seekTo(ev){
      if(!P()||!r._d)return;
      var rc=track.getBoundingClientRect(),f=Math.min(1,Math.max(0,(ev.clientX-rc.left)/rc.width));
      cmd(r,"seekTo",[f*r._d,true]);r._t=f*r._d;r._tt=Date.now();r._paint();
    }
    seek.addEventListener("pointerdown",function(ev){r._drag=true;seek.classList.add("drag");try{seek.setPointerCapture(ev.pointerId)}catch(e){}seekTo(ev);ev.stopPropagation()});
    seek.addEventListener("pointermove",function(ev){if(r._drag)seekTo(ev)});
    function endDrag(){r._drag=false;seek.classList.remove("drag")}
    seek.addEventListener("pointerup",endDrag);seek.addEventListener("pointercancel",endDrag);
    seek.addEventListener("click",function(ev){ev.stopPropagation()});

    var tipL=el("div","tip l","−10 detik"),tipR=el("div","tip r","+10 detik"),last=0,timer=null;
    function flash(t){t.classList.add("show");setTimeout(function(){t.classList.remove("show")},500)}
    function toggle(){
      if(!P())return;
      if(r._st===1){r._userPaused=true;cmd(r,"pauseVideo");r.classList.add("paused")}
      else{r._userPaused=false;cmd(r,"playVideo");r.classList.remove("paused")}
    }
    tap.addEventListener("click",function(ev){
      var now=Date.now();
      if(now-last<300){ // ketuk dua kali: maju/mundur 10 detik
        clearTimeout(timer);last=0;
        if(!P())return;
        var left=ev.clientX<r.getBoundingClientRect().left+r.offsetWidth/2,d=r._d||0;
        var c=(r._t||0)+(r._st===1&&r._tt?(Date.now()-r._tt)/1000:0);
        var nt=Math.min(Math.max(0,c+(left?-10:10)),d?d-0.1:1e9);
        cmd(r,"seekTo",[nt,true]);r._t=nt;r._tt=Date.now();
        flash(left?tipL:tipR);r._paint();
      }else{last=now;timer=setTimeout(toggle,300)}
    });

    var side=el("div","side");
    var like=el("button","btn"+(likes[id]?" on":""),likes[id]?"♥":"♡");
    like.setAttribute("aria-label","Suka");
    like.onclick=function(){if(likes[id])delete likes[id];else likes[id]=1;save(LIKE,likes);like.textContent=likes[id]?"♥":"♡";like.classList.toggle("on",!!likes[id])};
    var snd=el("button","btn snd",muted?"🔇":"🔊");snd.setAttribute("aria-label","Suara");
    snd.onclick=function(){
      muted=!muted;unlocked=true;setSound();
      if(P()){applySound(r);if(r._st!==1&&!r._userPaused)cmd(r,"playVideo")}
      startEl.classList.remove("show");
    };
    var sh=el("button","btn");sh.setAttribute("aria-label","Bagikan");
    sh.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
    sh.onclick=function(){openShare(id)};
    var yt=el("button","btn");yt.setAttribute("aria-label","Buka di YouTube");
    yt.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5.2 3z"/></svg>';
    yt.onclick=function(){window.open("https://www.youtube.com/shorts/"+id,"_blank","noopener")};
    side.appendChild(like);side.appendChild(snd);side.appendChild(sh);side.appendChild(yt);

    r.appendChild(poster);r.appendChild(host);r.appendChild(msg);r.appendChild(tap);
    r.appendChild(el("div","pp","▶"));r.appendChild(tipL);r.appendChild(tipR);r.appendChild(side);r.appendChild(seek);
    feed.appendChild(r);io.observe(r);
  }

  /* ---------- Bagikan ---------- */
  var shareEl=document.getElementById("share"),toast=document.getElementById("toast"),shareUrl="";
  var TEXT="Tonton video dakwah ini:",toastT=null;
  function say(t,ms){toast.textContent=t;toast.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){toast.classList.remove("show")},ms||1800)}
  function openShare(id){
    shareUrl=location.origin+location.pathname+"?v="+encodeURIComponent(id);
    document.getElementById("sl").textContent=shareUrl;
    document.getElementById("more").style.display=navigator.share?"flex":"none";
    shareEl.classList.add("open");
  }
  function copy(){
    function fb(){var t=document.createElement("textarea");t.value=shareUrl;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");say("Tautan disalin")}catch(e){say("Gagal menyalin")}document.body.removeChild(t)}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(shareUrl).then(function(){say("Tautan disalin")},fb);else fb();
  }
  shareEl.addEventListener("click",function(e){
    if(e.target===shareEl){shareEl.classList.remove("open");return}
    var b=e.target.closest(".opt");if(!b)return;
    var a=b.dataset.a,u=encodeURIComponent(shareUrl),t=encodeURIComponent(TEXT);
    if(a==="copy"){copy()}
    else if(a==="more"){navigator.share({title:"Dakwah Salaf",text:TEXT,url:shareUrl}).catch(function(){})}
    else{
      var link={wa:"https://wa.me/?text="+t+"%20"+u,tg:"https://t.me/share/url?url="+u+"&text="+t,fb:"https://www.facebook.com/sharer/sharer.php?u="+u,x:"https://twitter.com/intent/tweet?text="+t+"&url="+u}[a];
      window.open(link,"_blank","noopener");
    }
    shareEl.classList.remove("open");
  });

  function addBatch(){shuffled().forEach(addReel)}

  /* ---------- Tab Beranda (video panjang) + Tab ---------- */
  var home=document.getElementById("home"),watch=document.getElementById("watch"),tabsEl=document.getElementById("tabs"),HC="dakwah_home_v1",HMAX=25;
  function details(ids){
    var jobs=[],out=[];
    for(var i=0;i<ids.length;i+=50)(function(ch){
      jobs.push(api("videos",{part:"snippet,contentDetails",id:ch.join(",")}).then(function(d){
        (d.items||[]).forEach(function(v){var s=v.snippet,t=s.thumbnails||{};
          out.push({id:v.id,t:s.title,c:s.channelTitle,p:s.publishedAt,d:secs(v.contentDetails.duration),th:(t.maxres||t.medium||t.default||{}).url||""})});
      }));
    })(ids.slice(i,i+50));
    return Promise.all(jobs).then(function(){return out});
  }
  function plIds(pl,n){return api("playlistItems",{part:"contentDetails",maxResults:n,playlistId:pl}).then(function(d){return(d.items||[]).map(function(x){return x.contentDetails.videoId})})}
  function homeChannel(ch){
    var ck=HC+":"+ch,c=load(ck,null);
    if(c&&Date.now()-c.t<TTL)return Promise.resolve(c.items);
    return channelId(ch).then(function(id){
      // UULF + sisa ID channel = daftar video panjang (tanpa Shorts)
      return plIds("UULF"+id.slice(2),HMAX).catch(function(){return[]}).then(function(ids){return ids.length?ids:plIds("UU"+id.slice(2),50)});
    }).then(details).then(function(items){
      items=items.filter(function(v){return v.d>180});save(ck,{t:Date.now(),items:items});return items;
    }).catch(function(e){console.error(ch,e);return c?c.items:[]});
  }
  function fmtL(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+(m<10?"0":""):"")+m+":"+(x<10?"0":"")+x}
  function ago(p){var s=(Date.now()-new Date(p))/1000,u=[[31536000,"tahun"],[2592000,"bulan"],[604800,"minggu"],[86400,"hari"],[3600,"jam"],[60,"menit"]];for(var i=0;i<u.length;i++)if(s>=u[i][0])return Math.floor(s/u[i][0])+" "+u[i][1]+" lalu";return"baru saja"}
  function homeMsg(h,t){home.innerHTML="";var e=el("div","empty");e.appendChild(el("h2",null,h));if(t)e.appendChild(el("p",null,t));home.appendChild(e)}
  function renderHome(items){
    home.innerHTML="";var g=el("div","grid");
    items.forEach(function(v){
      var b=el("button","vc"),th=el("div","th"),inf=el("div","in");
      if(v.th)th.style.backgroundImage="url("+v.th+")";
      th.appendChild(el("span","du",fmtL(v.d)));
      inf.appendChild(el("div","ti",v.t));inf.appendChild(el("div","me",v.c+" · "+ago(v.p)));
      b.appendChild(th);b.appendChild(inf);b.onclick=function(){openWatch(v)};g.appendChild(b);
    });
    home.appendChild(g);
  }
  function loadHome(){
    if(!YT_API_KEY||!YT_CHANNELS.length){homeMsg("Channel belum diatur","Isi YT_CHANNELS dan YT_API_KEY di bagian PENGATURAN pada file ini.");return}
    Promise.all(YT_CHANNELS.map(homeChannel)).then(function(ls){
      var a=[];ls.forEach(function(l){a=a.concat(l)});
      a.sort(function(x,y){return new Date(y.p)-new Date(x.p)});
      if(!a.length)homeMsg("Video belum tersedia","Periksa link channel dan API key, lalu coba lagi.");else renderHome(a.slice(0,100));
    });
  }
  function openWatch(v){
    var pl=watch.querySelector(".pl"),f=document.createElement("iframe");pl.innerHTML="";
    f.src="https://www.youtube-nocookie.com/embed/"+v.id+"?autoplay=1&playsinline=1&rel=0"+(/^https?:$/.test(location.protocol)?"&origin="+encodeURIComponent(location.origin):"");
    f.allow="autoplay; encrypted-media; fullscreen";f.allowFullscreen=true;pl.appendChild(f);
    watch.querySelector(".wt").textContent=v.t;watch.querySelector(".wc").textContent=v.c;
    watch.querySelector(".wy").onclick=function(){window.open("https://www.youtube.com/watch?v="+v.id,"_blank","noopener")};
    watch.classList.add("open");
  }
  function closeWatch(){watch.classList.remove("open");watch.querySelector(".pl").innerHTML=""}
  watch.querySelector(".wx").onclick=closeWatch;
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeWatch()});
  function setTab(t){
    tab=t;
    document.body.classList.toggle("h",t==="home");
    home.style.display=t==="home"?"block":"none";
    feed.style.display=t==="short"?"block":"none";
    [].forEach.call(tabsEl.children,function(b){b.classList.toggle("on",b.dataset.t===t)});
    startEl.classList.remove("show");
    if(t==="short"){
      closeWatch();
      var r=cur&&cur.r;
      if(r){
        r._userPaused=false;r.classList.remove("paused");
        if(r._f&&r._ready&&!r._fb){applySound(r);cmd(r,"playVideo");verify(r)}else playReel(r);
        guard(r);
      }
    }else if(cur)pauseReel(cur.r);
  }
  tabsEl.addEventListener("click",function(e){var b=e.target.closest("button");if(b&&b.dataset.t!==tab)setTab(b.dataset.t)});
  setTab(tab);loadHome();

  if(!EXTRA_IDS.length&&(!YT_CHANNELS.length||!YT_API_KEY)){
    showMsg("Channel belum diatur","Isi YT_CHANNELS dan YT_API_KEY di bagian PENGATURAN pada file ini.");
    return;
  }
  fetchList().then(function(items){
    pool=items.filter(function(x,i){return /^[\w-]{11}$/.test(x)&&items.indexOf(x)===i});
    if(!pool.length){showMsg("Video belum tersedia");return}
    feed.innerHTML="";addBatch();
  }).catch(function(e){console.error(e);showMsg("Video belum tersedia","Periksa link channel dan API key, lalu coba lagi.")});
})();

// Pasang sebagai aplikasi (PWA)
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
var dip=null,ib=document.getElementById("install");
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dip=e;ib.style.display="inline-block"});
ib.addEventListener("click",function(){if(!dip)return;dip.prompt();dip.userChoice.finally(function(){dip=null;ib.style.display="none"})});
window.addEventListener("appinstalled",function(){ib.style.display="none"});
</script>
