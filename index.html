<style>
:root{--bg:#000;--fg:#fff;--mut:rgba(255,255,255,.7);--acc:#2fbf71;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#feed{height:calc(100% - 56px - env(safe-area-inset-bottom,0px));overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
#feed.away{visibility:hidden;pointer-events:none;position:fixed;left:-200vw;top:0;width:100vw}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden;contain:layout paint}
.btn.q{font-size:12px;font-weight:700}
.poster{position:absolute;inset:0;background:#000 center/cover no-repeat;transition:opacity .25s;z-index:1;pointer-events:none}
.reel.playing .poster{opacity:0}
.reel.fb .poster{display:none}
.yt{position:absolute;inset:0}
.yt iframe{width:100%;height:100%;border:0;pointer-events:none;background:#000}
.tap{position:absolute;inset:0;z-index:2}
.reel.fb .tap,.reel.fb .seek,.reel.fb .pp{display:none}
.reel.fb .yt iframe{pointer-events:auto}
.side{position:absolute;right:10px;bottom:84px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:4}
.btn{width:46px;height:46px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px)}
.btn.on{color:#ff5a6e}
.seek{position:absolute;left:0;right:0;bottom:0;padding:0 14px 12px;touch-action:none;cursor:pointer;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:3}
.time{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;color:#fff;padding-bottom:10px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.track{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.3);transition:height .15s}
.track i{display:block;height:100%;width:0;border-radius:2px;background:var(--acc)}
.track b{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.5)}
.seek.drag .track{height:8px}
.seek.drag .time{font-size:18px;font-weight:600}
#share{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
#share.open{display:flex}
.sp{width:100%;background:#1b1b1b;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sp h3{font-size:16px;margin-bottom:4px}
.sp small{display:block;color:var(--mut);font-size:12px;margin-bottom:16px;word-break:break-all}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
.opt{background:none;border:0;color:#fff;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.opt i{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:16px;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#start{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.65);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:32px;cursor:pointer}
#start.show{display:flex}
#start .go{width:84px;height:84px;border-radius:50%;background:var(--acc);color:#04210f;display:flex;align-items:center;justify-content:center;font-size:38px}
#start p{font-size:15px;color:#fff}
.tip{position:absolute;top:50%;margin-top:-30px;padding:10px 16px;border-radius:24px;background:rgba(0,0,0,.55);font-size:16px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
.tip.show{opacity:1}
.tip.l{left:12%}.tip.r{right:12%}
.pp{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:34px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
.reel.paused .pp{opacity:1}
.top{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:18px;font-weight:700}
#install{display:none;pointer-events:auto;border:0;border-radius:14px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--acc);color:#04210f;cursor:pointer}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:12px;color:var(--mut);line-height:1.5}
.empty h2{color:var(--fg);font-size:20px}
.msg{position:absolute;inset:0;margin:auto;height:fit-content;width:fit-content;max-width:80%;text-align:center;background:rgba(0,0,0,.7);padding:12px 16px;border-radius:12px;font-size:14px;display:none;z-index:2}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#000;border-top:1px solid rgba(255,255,255,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;height:56px;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
#tabs button.on{color:#fff}
#tabs svg{width:24px;height:24px;fill:currentColor}
body.h .top{background:#000}
#home{position:fixed;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));overflow-y:auto;padding:calc(52px + env(safe-area-inset-top,0px)) 0 16px;overscroll-behavior:contain;background:#000;display:none}
#home .grid,#hist .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:20px 12px}
@media(min-width:600px){#home .grid,#hist .grid{padding:0 12px}}
#home .vc,#hist .vc{content-visibility:auto;contain-intrinsic-size:auto 290px}
.vc{display:block;width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.vc .th{position:relative;aspect-ratio:16/9;background:#222 center/cover no-repeat}
.vc .du{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);padding:2px 5px;border-radius:4px;font-size:12px;font-weight:600}
.vc .in{padding:10px 12px 0}
.vc .ti{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc .me{font-size:12.5px;color:var(--mut);margin-top:4px}
#watch{position:fixed;inset:0;z-index:12;background:#000;display:none;flex-direction:column}
#watch.open{display:flex}
#watch .bar{padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px}
#watch .wx{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer}
#watch .pl{width:min(100%,calc((100dvh - 130px) * 1.7778));aspect-ratio:16/9;margin:0 auto;background:#000}
#watch .pl iframe{width:100%;height:100%;border:0}
#watch .info{padding:14px;overflow:auto;max-width:900px;margin:0 auto;width:100%}
#watch .wt{font-size:17px;line-height:1.35}
#watch .wc{color:var(--mut);font-size:13px;margin:6px 0 14px}
#watch .wy{border:0;border-radius:18px;padding:9px 16px;font-weight:700;background:var(--acc);color:#04210f;cursor:pointer}
#chs,#chp,#hist{position:fixed;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));overflow-y:auto;background:#000;display:none;overscroll-behavior:contain}
#chs,#hist{padding:calc(52px + env(safe-area-inset-top,0px)) 0 16px}
#chp{z-index:5;padding-bottom:16px}#chp.open{display:block}
#chp .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:20px 12px}
@media(min-width:600px){#chp .grid{padding:0 12px}}
#home .grid,#hist .grid,#chp .grid,.cgrid,.pg{max-width:1400px;margin-left:auto;margin-right:auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,45%),1fr));gap:12px;padding:8px 12px}
.cc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:0;border-radius:14px;background:rgba(255,255,255,.07);color:inherit;font:inherit;text-align:center;cursor:pointer;min-width:0}
.cc .av{width:72px;height:72px;font-size:28px}
.cc b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.3;word-break:break-word}
.cc small{color:var(--mut);font-size:12px;word-break:break-word}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr))}
.cr{display:flex;align-items:center;gap:14px;width:100%;padding:10px 16px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.cr b{display:block;font-size:16px}.cr small{color:var(--mut);font-size:12.5px}
.av{width:44px;height:44px;border-radius:50%;background:#2a2a2a center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
.cr .av{width:64px;height:64px;font-size:24px}
.vc .rw{display:flex;gap:10px;padding:10px 12px 0}.vc .rw .in{padding:0;min-width:0}.vc .rw .av{width:36px;height:36px;font-size:14px}
.lv{position:absolute;left:8px;top:8px;background:#e11;padding:2px 6px;border-radius:4px;font-size:12px;font-weight:700}.lv.r{background:rgba(0,0,0,.8)}
.sec{padding:4px 12px 10px;font-size:16px;font-weight:700}
.cb{position:relative;height:calc(90px + env(safe-area-inset-top,0px));background:#222 center/cover no-repeat}
.cb .wx{position:absolute;left:8px;top:calc(8px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer}
.ch{display:flex;gap:14px;align-items:center;padding:14px 16px}.ch .av{width:72px;height:72px;font-size:28px;cursor:default}
.ch h2{font-size:20px}.ch p{color:var(--mut);font-size:12.5px;margin:3px 0 10px}
.sub{border:0;border-radius:18px;padding:8px 16px;font-weight:700;background:#fff;color:#000;cursor:pointer}
.ct{position:sticky;top:0;z-index:2;display:flex;gap:6px;overflow-x:auto;background:#000;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.12);scrollbar-width:none}
.ct button,.so button{flex:none;border:0;border-radius:16px;padding:7px 14px;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:13px;cursor:pointer}
.ct button.on,.so button.on{background:#fff;color:#000}
.so{display:flex;gap:6px;padding:10px 12px}
.vc .rw .in{flex:1}.vc .rw .hx{flex:none;align-self:flex-start;width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--mut);font-size:16px;cursor:pointer}
.gs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(120px,30%),1fr));gap:8px 4px;padding:0 4px;max-width:1400px;margin:0 auto}
.gs .vc .th{aspect-ratio:9/16}.gs .vc .ti{font-size:12.5px}.gs .vc .in{padding:6px 4px 0}
.pr{display:flex;gap:10px;padding:6px 12px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.pr .th{position:relative;width:150px;aspect-ratio:16/9;flex:none;background:#222 center/cover no-repeat}
.pr .du{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);padding:2px 5px;border-radius:4px;font-size:12px;font-weight:600}
.pr .ti{font-size:14px;font-weight:600;line-height:1.35}
.ab{padding:14px 16px;white-space:pre-wrap;line-height:1.5;font-size:14px;color:var(--mut)}
#oth{position:fixed;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));overflow-y:auto;background:#000;display:none;padding:calc(52px + env(safe-area-inset-top,0px)) 0 16px}
#watch .pl.v{width:min(100%,calc((100dvh - 130px) * .5625));aspect-ratio:9/16}
#watch .pl{position:relative}
#watch .pn{position:absolute;left:0;right:0;top:0;bottom:56px;z-index:2;touch-action:none;cursor:pointer}
#watch .pn.paused::after{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:54px;color:#fff;opacity:.85;text-shadow:0 2px 8px #000}
#watch .pc{position:absolute;right:8px;top:8px;z-index:3;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 9px;border-radius:12px;pointer-events:none}
#watch .ph{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);z-index:3;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:6px 12px;border-radius:14px;pointer-events:none;white-space:nowrap;animation:phf 3.5s forwards}
@keyframes phf{0%,70%{opacity:1}100%{opacity:0}}
#watch .pl.v{overflow:hidden}
#watch .sf{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#watch .sf::-webkit-scrollbar{display:none}
#watch .ss{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000 center/cover no-repeat}
#watch .ss iframe{position:absolute;inset:0;z-index:1}
#watch .ss .pn{inset:0;bottom:0;z-index:2;touch-action:pan-y}
#watch .pl.su{animation:shu .25s ease-out}
#watch .pl.sd{animation:shd .25s ease-out}
@keyframes shu{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes shd{from{transform:translateY(-40px);opacity:.3}to{transform:none;opacity:1}}
#watch .wc.lk{cursor:pointer;text-decoration:underline}
.ci{flex:1;min-width:0;border:0;border-radius:16px;padding:8px 14px;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:13px;outline:none}
.ci::placeholder{color:var(--mut)}
.sw{position:relative}
.sg{position:absolute;left:12px;right:12px;top:calc(100% - 6px);z-index:20;max-height:260px;overflow:auto;background:#1c1c1e;border:1px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.si{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#fff;font:inherit;font-size:14px;text-align:left;padding:10px 14px;cursor:pointer}
.si+.si{border-top:1px solid rgba(255,255,255,.08)}
.si:active,.si:hover{background:rgba(255,255,255,.1)}
.si small{display:block;color:var(--mut);font-size:12px}
#mapv{position:fixed;inset:0;z-index:12;background:#000;display:none;flex-direction:column}
#mapv.open{display:flex}
#mapv .bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px}
#mapv .wx{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer}
#mapv .mt{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mapv .wy{flex:none;border:0;border-radius:18px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--acc);color:#04210f;cursor:pointer}
#mapv iframe{flex:1;width:100%;border:0;background:#222}
.gh1{max-width:1400px;margin:0 auto;padding:18px 12px 4px;font-size:26px;font-weight:800}
.gh2{max-width:1400px;margin:0 auto;padding:8px 12px 2px;font-size:18px;font-weight:700;color:var(--acc)}
.gh3{max-width:1400px;margin:0 auto;padding:4px 12px 4px;font-size:14px;font-weight:600;color:var(--mut)}
#watch .wb{border:0;border-radius:18px;padding:9px 16px;font-weight:700;background:#2a2a2a;color:#fff;cursor:pointer;margin-right:8px}
#watch .wth{border:0;border-radius:18px;padding:9px 16px;font-weight:700;background:#2a2a2a;color:#fff;cursor:pointer;margin-right:8px}
#watch .wsp{border:0;border-radius:18px;padding:9px 16px;font-weight:700;background:#1db954;color:#04210f;cursor:pointer;margin-right:8px;display:none}
.shov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:900;display:flex;align-items:flex-end}
.shs{background:#1a1a1a;color:#fff;width:100%;max-width:600px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.shs h3{font-size:16px;margin:0 0 4px}.shs .sn{font-size:12px;opacity:.65;margin:0 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.shs .lk button,.shs .yl{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--acc);color:#04210f;cursor:pointer}
.shs .gr{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.shs .gr button{border:0;background:#2a2a2a;color:#fff;border-radius:12px;padding:12px 4px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.shs .gr b{font-size:20px;line-height:1}
.shs label{display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 12px}
.shs .yl{background:#2a2a2a;color:#fff;margin-top:12px;width:100%}
#snh{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:12;background:rgba(0,0,0,.7);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:18px;display:none;pointer-events:none;white-space:nowrap}
#snh.show{display:block}

<body>
<div class="top"><h1>Dakwah Salaf</h1><button id="install">Pasang</button></div>
<div id="share"><div class="sp">
  <h3>Bagikan video</h3><small id="sl"></small>
  <div class="opts">
    <button class="opt" data-a="wa"><i style="background:#25d366">WA</i>WhatsApp</button>

  </div>

    }).then(revGeo).then(function(l){save(NK,{t:Date.now(),x:l});return l});

      if(tab!==t)return;
      if(t==="history")renderHist();
      if(t==="oth"){var o=document.getElementById("oth");if(oSel!==-1||!o.firstChild){oSel=-1;renderOth()}else o.scrollTop=0}
      if(t==="short"){
        closeWatch();
        if(!cur&&pend){var pr=pend;pend=null;activate(pr)}
        var r=cur&&cur.r;
        if(r){
          r._userPaused=false;r.classList.remove("paused");
          if(r._f&&r._ready&&!r._fb){applySound(r);cmd(r,"playVideo");verify(r)}else playReel(r);
          guard(r);
        }
      }else if(cur)pauseReel(cur.r);
    },0)});
  }
  tabsEl.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.t!==tab)setTab(b.dataset.t);else chp.classList.remove("open")});
  setTab(tab);loadHome();
  (function(){
    var q=new URLSearchParams(location.search),id=q.get("v"),st=parseInt(q.get("t"),10)||0;
    if(!id||!/^[\w-]{11}$/.test(id))return;
    want=null;try{history.replaceState(null,"",location.pathname)}catch(e){}
    var fb={id:id,t:"Video dakwah",c:"",d:0,th:"https://i.ytimg.com/vi/"+id+"/mqdefault.jpg",st:st};
    (YT_API_KEY?details([id]):Promise.resolve([])).then(function(a){var v=a[0]||fb;v.st=st;openWatch(v,null,false)}).catch(function(){openWatch(fb,null,false)});
  })();

  if(!EXTRA_IDS.length&&(!YT_CHANNELS.length||!YT_API_KEY)){
    showMsg("Channel belum diatur","Isi YT_CHANNELS dan YT_API_KEY di bagian PENGATURAN pada file ini.");
    return;
  }
  fetchList(function(more){ // channel yang selesai belakangan: tambahkan ke pool
    more.forEach(function(x){if(/^[\w-]{11}$/.test(x)&&pool.indexOf(x)<0)pool.push(x)});
  }).then(function(items){
    pool=items.filter(function(x,i){return /^[\w-]{11}$/.test(x)&&items.indexOf(x)===i});
    if(!pool.length){showMsg("Video belum tersedia");return}
    feed.innerHTML="";
    // batch pertama kecil (20 video) supaya cepat dirender; batch berikutnya memuat pool lengkap dari semua channel
    shuffled().slice(0,20).forEach(addReel);
    // siapkan dua short pertama di latar belakang agar tab Short langsung siap saat dibuka
    if(tab!=="short"){[0,1].forEach(function(k){var r=feed.children[k];if(r&&r.classList.contains("reel"))setTimeout(function(){if(!r._f&&!cur)build(r,false)},k*250)})}
  }).catch(function(e){console.error(e);showMsg("Video belum tersedia","Periksa link channel dan API key, lalu coba lagi.")});
})();

// Pasang sebagai aplikasi (PWA)
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
var dip=null,ib=document.getElementById("install");
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dip=e;ib.style.display="inline-block"});
ib.addEventListener("click",function(){if(!dip)return;dip.prompt();dip.userChoice.finally(function(){dip=null;ib.style.display="none"})});
window.addEventListener("appinstalled",function(){ib.style.display="none"});

// Banner: saran buka di Chrome bila dibuka dari browser dalam aplikasi (Instagram/Facebook)
(function(){
  var ua=navigator.userAgent||"",b=document.getElementById("igb");
  if(!b||!/Instagram|FBAN|FBAV|FB_IAB/i.test(ua))return;
  try{if(sessionStorage.getItem("igb")==="x")return}catch(e){}
  var url=ORIG_URL||location.href;
  b.classList.add("show");
  document.getElementById("igx").onclick=function(){b.classList.remove("show");try{sessionStorage.setItem("igb","x")}catch(e){}};
  document.getElementById("igc").onclick=function(){
    if(/Android/i.test(ua)){
      var u=new URL(url);
      location.href="intent://"+u.host+u.pathname+u.search+u.hash+"#Intent;scheme="+u.protocol.replace(":","")+";package=com.android.chrome;end";
    }else{
      location.href="googlechrome://"+url.replace(/^https?:\/\//,"");
    }
  };
  document.getElementById("igl").onclick=function(){
    var t=document.getElementById("toast");
    function ok(){t.textContent="Link disalin. Tempel di Chrome.";t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200)}
    function old(){var i=document.createElement("input");i.value=url;document.body.appendChild(i);i.select();try{document.execCommand("copy")}catch(e){}i.remove();ok()}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(ok,old);else old();
  };
})();
</script>
